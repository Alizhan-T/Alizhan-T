name: Refresh profile activity
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/activity.yml'
      - 'scripts/activity.py'
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: write

concurrency:
  group: profile-activity
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Render the contribution calendar
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/activity.py
      - name: Publish changed artwork
        run: |
          if ! git diff --quiet -- assets/activity.svg; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add assets/activity.svg
            git commit -m 'Refresh contribution dashboard'
            git push origin HEAD:main
          fi
