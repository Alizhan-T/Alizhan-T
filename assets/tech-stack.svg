<svg xmlns="http://www.w3.org/2000/svg" width="850" height="320" viewBox="0 0 850 320" fill="none" role="img" aria-labelledby="stackTitle stackDesc">
  <title id="stackTitle">TECH STACK</title>
  <desc id="stackDesc">Six animated tech stack cards with wave motion and geometric patterns: Python, Swift, Node.js, Flutter, Solidity, Docker.</desc>
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif; }
    .mono { font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; }

    /* Synchronized back-and-forth wave across all 6 cards */
    .card {
      animation: waveCard 4.8s ease-in-out infinite alternate;
    }
    .c1 { animation-delay: -1.75s; }
    .c2 { animation-delay: -1.40s; }
    .c3 { animation-delay: -1.05s; }
    .c4 { animation-delay: -0.70s; }
    .c5 { animation-delay: -0.35s; }
    .c6 { animation-delay:  0.00s; }

    @keyframes waveCard {
      0%   { transform: translateY(-7px); }
      100% { transform: translateY(7px); }
    }

    /* Subtle inner geometric parallax in sync with each card */
    .px {
      animation: innerShift 4.8s ease-in-out infinite alternate;
    }
    .px-alt {
      animation: innerShiftAlt 4.8s ease-in-out infinite alternate;
    }
    .p1 { animation-delay: -1.75s; }
    .p2 { animation-delay: -1.40s; }
    .p3 { animation-delay: -1.05s; }
    .p4 { animation-delay: -0.70s; }
    .p5 { animation-delay: -0.35s; }
    .p6 { animation-delay:  0.00s; }

    @keyframes innerShift {
      0%   { transform: translate(-4px, -5px); }
      100% { transform: translate(4px, 5px); }
    }
    @keyframes innerShiftAlt {
      0%   { transform: translate(4px, 5px); }
      100% { transform: translate(-4px, -5px); }
    }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }
  </style>
  <defs>
    <clipPath id="outerClip">
      <rect x="0.5" y="0.5" width="849" height="319" rx="14"/>
    </clipPath>

    <!-- Per-card artwork clipPaths (matching staggered y positions) -->
    <clipPath id="art1"><rect x="32"  y="76" width="138" height="146" rx="11"/></clipPath>
    <clipPath id="art2"><rect x="182" y="88" width="108" height="138" rx="11"/></clipPath>
    <clipPath id="art3"><rect x="302" y="72" width="132" height="150" rx="11"/></clipPath>
    <clipPath id="art4"><rect x="446" y="88" width="114" height="138" rx="11"/></clipPath>
    <clipPath id="art5"><rect x="572" y="74" width="128" height="148" rx="11"/></clipPath>
    <clipPath id="art6"><rect x="712" y="86" width="106" height="140" rx="11"/></clipPath>

    <radialGradient id="topGlow" cx="425" cy="0" r="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7C6CF6" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#7C6CF6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="divL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F3DEC2" stop-opacity="0"/>
      <stop offset="1" stop-color="#F3DEC2" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="divR" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F3DEC2" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#F3DEC2" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="artFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#12131B" stop-opacity="0"/>
      <stop offset="1" stop-color="#12131B" stop-opacity="1"/>
    </linearGradient>
    <pattern id="microDots" width="12" height="12" patternUnits="userSpaceOnUse">
      <circle cx="6" cy="6" r="1" fill="#D5C8FF" fill-opacity="0.2"/>
    </pattern>
  </defs>

  <g clip-path="url(#outerClip)">
    <rect width="850" height="320" fill="#0D0E14"/>
    <rect width="850" height="320" fill="url(#topGlow)"/>

    <!-- Heading -->
    <rect x="278" y="40" width="60" height="1" fill="url(#divL)"/>
    <text class="sans" x="425" y="45" text-anchor="middle" font-size="13.5" font-weight="700" letter-spacing="6" fill="#F3DEC2">TECH STACK</text>
    <rect x="512" y="40" width="60" height="1" fill="url(#divR)"/>

    <!-- Card 1: Python (w=138, y=76, h=208) -->
    <g class="card c1">
      <rect x="32.5" y="76.5" width="137" height="207" rx="12" fill="#12131B" stroke="#1F222E"/>
      <g clip-path="url(#art1)">
        <rect x="32" y="76" width="138" height="146" fill="#191733"/>
        <circle cx="101" cy="148" r="64" stroke="#E6C29F" stroke-opacity="0.4" stroke-dasharray="6 5"/>
        <g class="px p1">
          <circle cx="84" cy="134" r="44" fill="#7C6CF6"/>
          <circle cx="71" cy="116" r="4.5" fill="#0D0E14"/>
        </g>
        <g class="px-alt p1">
          <circle cx="120" cy="166" r="44" fill="#D5C8FF" fill-opacity="0.92"/>
          <circle cx="133" cy="184" r="4.5" fill="#0D0E14"/>
        </g>
        <rect x="32" y="182" width="138" height="40" fill="url(#artFade)"/>
      </g>
      <text class="sans" x="101" y="256" text-anchor="middle" font-size="15" font-weight="600" fill="#FFFFFF">Python</text>
      <text class="mono" x="101" y="273" text-anchor="middle" font-size="9.5" letter-spacing="1.2" fill="#71717A">AI · ML</text>
    </g>

    <!-- Card 2: Swift (w=108, y=88, h=200) -->
    <g class="card c2">
      <rect x="182.5" y="88.5" width="107" height="199" rx="12" fill="#12131B" stroke="#1F222E"/>
      <g clip-path="url(#art2)">
        <rect x="182" y="88" width="108" height="138" fill="#161420"/>
        <g class="px p2">
          <circle cx="264" cy="114" r="10" fill="#F3C98B"/>
          <path d="M188 112 C226 122 256 146 278 188" stroke="#E6C29F" stroke-opacity="0.72" stroke-width="1.5"/>
          <path d="M188 132 C220 140 246 160 262 192" stroke="#D5C8FF" stroke-opacity="0.52" stroke-width="1.4"/>
        </g>
        <g class="px-alt p2">
          <path d="M174 234 L174 178 C206 156 244 196 300 144 L300 234 Z" fill="#2A264A"/>
          <path d="M174 234 L174 198 C210 176 242 204 300 166 L300 234 Z" fill="#E6C29F" fill-opacity="0.62"/>
          <path d="M174 234 L174 214 C216 198 248 218 300 188 L300 234 Z" fill="#F3DEC2"/>
        </g>
        <rect x="182" y="186" width="108" height="40" fill="url(#artFade)"/>
      </g>
      <text class="sans" x="236" y="260" text-anchor="middle" font-size="15" font-weight="600" fill="#FFFFFF">Swift</text>
      <text class="mono" x="236" y="277" text-anchor="middle" font-size="9.5" letter-spacing="1.2" fill="#71717A">iOS</text>
    </g>

    <!-- Card 3: Node.js (w=132, y=72, h=212) -->
    <g class="card c3">
      <rect x="302.5" y="72.5" width="131" height="211" rx="12" fill="#12131B" stroke="#1F222E"/>
      <g clip-path="url(#art3)">
        <rect x="302" y="72" width="132" height="150" fill="#131124"/>
        <g class="px-alt p3">
          <polygon points="368,84 422,115 422,177 368,208 314,177 314,115" fill="#1D1A3B" stroke="#7C6CF6" stroke-opacity="0.55" stroke-width="1.2"/>
          <polygon points="368,101 407,124 407,168 368,191 329,168 329,124" stroke="#D5C8FF" stroke-opacity="0.65" stroke-width="1.2"/>
        </g>
        <g class="px p3">
          <polygon points="368,118 392,132 392,160 368,174 344,160 344,132" fill="#7C6CF6"/>
          <polygon points="368,134 378,140 378,152 368,158 358,152 358,140" fill="#F3DEC2"/>
        </g>
        <rect x="302" y="182" width="132" height="40" fill="url(#artFade)"/>
      </g>
      <text class="sans" x="368" y="256" text-anchor="middle" font-size="15" font-weight="600" fill="#FFFFFF">Node.js</text>
      <text class="mono" x="368" y="273" text-anchor="middle" font-size="9.5" letter-spacing="1.2" fill="#71717A">BACKEND</text>
    </g>

    <!-- Card 4: Flutter (w=114, y=88, h=200) -->
    <g class="card c4">
      <rect x="446.5" y="88.5" width="113" height="199" rx="12" fill="#12131B" stroke="#1F222E"/>
      <g clip-path="url(#art4)">
        <rect x="446" y="88" width="114" height="138" fill="#141220"/>
        <g class="px-alt p4">
          <g transform="rotate(-34 503 156)">
            <rect x="410" y="96"  width="186" height="17" fill="#2A264A"/>
            <rect x="410" y="121" width="186" height="17" fill="#7C6CF6"/>
            <rect x="410" y="146" width="186" height="17" fill="#D5C8FF"/>
            <rect x="410" y="171" width="186" height="17" fill="#7C6CF6" fill-opacity="0.5"/>
            <rect x="410" y="196" width="186" height="17" fill="#2A264A"/>
          </g>
        </g>
        <g class="px p4">
          <polygon points="494,118 520,118 488,150 520,182 494,182 462,150" fill="#F3DEC2" stroke="#12131B" stroke-width="2"/>
        </g>
        <rect x="446" y="186" width="114" height="40" fill="url(#artFade)"/>
      </g>
      <text class="sans" x="503" y="260" text-anchor="middle" font-size="15" font-weight="600" fill="#FFFFFF">Flutter</text>
      <text class="mono" x="503" y="277" text-anchor="middle" font-size="9.5" letter-spacing="1.2" fill="#71717A">MOBILE</text>
    </g>

    <!-- Card 5: Solidity (w=128, y=74, h=210) -->
    <g class="card c5">
      <rect x="572.5" y="74.5" width="127" height="209" rx="12" fill="#12131B" stroke="#1F222E"/>
      <g clip-path="url(#art5)">
        <rect x="572" y="74" width="128" height="148" fill="#15121F"/>
        <rect x="572" y="74" width="128" height="148" fill="url(#microDots)"/>
        <circle class="px-alt p5" cx="636" cy="148" r="56" stroke="#7C6CF6" stroke-opacity="0.4" stroke-dasharray="4 5"/>
        <g class="px p5">
          <polygon points="636,92 671,146 636,166 601,146" fill="#D5C8FF"/>
          <polygon points="636,92 671,146 636,166" fill="#7C6CF6"/>
          <polygon points="601,156 636,176 671,156 636,206" fill="#E6C29F"/>
          <polygon points="636,176 671,156 636,206" fill="#F3DEC2"/>
        </g>
        <rect x="572" y="182" width="128" height="40" fill="url(#artFade)"/>
      </g>
      <text class="sans" x="636" y="256" text-anchor="middle" font-size="15" font-weight="600" fill="#FFFFFF">Solidity</text>
      <text class="mono" x="636" y="273" text-anchor="middle" font-size="9.5" letter-spacing="1.2" fill="#71717A">WEB3</text>
    </g>

    <!-- Card 6: Docker (w=106, y=86, h=202) -->
    <g class="card c6">
      <rect x="712.5" y="86.5" width="105" height="201" rx="12" fill="#12131B" stroke="#1F222E"/>
      <g clip-path="url(#art6)">
        <rect x="712" y="86" width="106" height="140" fill="#131120"/>
        <g class="px-alt p6">
          <path d="M704 234 L704 192 C726 180 746 204 768 192 S804 184 826 196 L826 234 Z" fill="#2A264A"/>
          <path d="M704 234 L704 208 C730 198 750 214 774 206 S806 200 826 210 L826 234 Z" fill="#7C6CF6" fill-opacity="0.38"/>
        </g>
        <g class="px p6">
          <path d="M724 166 H808 C806 184 788 196 765 196 C743 196 728 186 724 166 Z" fill="#7C6CF6"/>
          <rect x="731" y="148" width="14" height="14" rx="3" fill="#D5C8FF"/>
          <rect x="749" y="148" width="14" height="14" rx="3" fill="#7C6CF6" stroke="#D5C8FF" stroke-opacity="0.65"/>
          <rect x="767" y="148" width="14" height="14" rx="3" fill="#E6C29F"/>
          <rect x="785" y="148" width="14" height="14" rx="3" fill="#D5C8FF"/>
          <rect x="749" y="130" width="14" height="14" rx="3" fill="#F3DEC2"/>
          <rect x="767" y="130" width="14" height="14" rx="3" fill="#2A264A" stroke="#D5C8FF" stroke-opacity="0.65"/>
          <rect x="767" y="112" width="14" height="14" rx="3" fill="#D5C8FF"/>
        </g>
        <rect x="712" y="192" width="106" height="34" fill="url(#artFade)"/>
      </g>
      <text class="sans" x="765" y="260" text-anchor="middle" font-size="15" font-weight="600" fill="#FFFFFF">Docker</text>
      <text class="mono" x="765" y="277" text-anchor="middle" font-size="9.5" letter-spacing="1.2" fill="#71717A">DEVOPS</text>
    </g>
  </g>

  <rect x="0.5" y="0.5" width="849" height="319" rx="14" stroke="#1F222E"/>
</svg>
