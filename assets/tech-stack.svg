<svg xmlns="http://www.w3.org/2000/svg" width="850" height="270" viewBox="0 0 850 270" fill="none" role="img" aria-labelledby="stackTitle stackDesc">
  <title id="stackTitle">TECH STACK</title>
  <desc id="stackDesc">Six cards standing angled in 3D perspective, smoothly opening forward one by one in a continuous wave: Python, Swift, Node.js, Flutter, Solidity, Docker.</desc>
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif; }
    .mono { font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; }

    /* 3D perspective shelf animation: cards rest angled sideways, smoothly unfold to face forward, pause briefly, and smoothly fold back sideways */
    .card {
      animation: unfoldCard 12s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
    }

    .c1 { transform-origin:  92px 152px; animation-delay:  -1.4s; }
    .c2 { transform-origin: 225px 152px; animation-delay: -11.4s; }
    .c3 { transform-origin: 358px 152px; animation-delay:  -9.4s; }
    .c4 { transform-origin: 491px 152px; animation-delay:  -7.4s; }
    .c5 { transform-origin: 624px 152px; animation-delay:  -5.4s; }
    .c6 { transform-origin: 757px 152px; animation-delay:  -3.4s; }

    @keyframes unfoldCard {
      0%    { transform: translateY(5px)  scaleX(0.56) skewY(-9deg); opacity: 0.68; }
      9%    { transform: translateY(-7px) scaleX(1.04) skewY(0deg);  opacity: 1;    }
      17%   { transform: translateY(-7px) scaleX(1.04) skewY(0deg);  opacity: 1;    }
      27%   { transform: translateY(5px)  scaleX(0.56) skewY(-9deg); opacity: 0.68; }
      100%  { transform: translateY(5px)  scaleX(0.56) skewY(-9deg); opacity: 0.68; }
    }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
      .card { transform: none; opacity: 1; }
    }
  </style>
  <defs>
    <clipPath id="outerClip"><rect x="0.5" y="0.5" width="849" height="269" rx="14"/></clipPath>

    <clipPath id="art1"><rect x="32"  y="66" width="120" height="114" rx="11"/></clipPath>
    <clipPath id="art2"><rect x="165" y="66" width="120" height="114" rx="11"/></clipPath>
    <clipPath id="art3"><rect x="298" y="66" width="120" height="114" rx="11"/></clipPath>
    <clipPath id="art4"><rect x="431" y="66" width="120" height="114" rx="11"/></clipPath>
    <clipPath id="art5"><rect x="564" y="66" width="120" height="114" rx="11"/></clipPath>
    <clipPath id="art6"><rect x="697" y="66" width="120" height="114" rx="11"/></clipPath>

    <radialGradient id="topGlow" cx="425" cy="0" r="400" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7C6CF6" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#7C6CF6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="divL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F3DEC2" stop-opacity="0"/>
      <stop offset="1" stop-color="#F3DEC2" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="divR" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F3DEC2" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#F3DEC2" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="artFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#12131B" stop-opacity="0"/>
      <stop offset="1" stop-color="#12131B" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="cardEdge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#D5C8FF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#D5C8FF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#D5C8FF" stop-opacity="0"/>
    </linearGradient>
    <pattern id="microDots" width="12" height="12" patternUnits="userSpaceOnUse">
      <circle cx="6" cy="6" r="1" fill="#D5C8FF" fill-opacity="0.2"/>
    </pattern>
  </defs>

  <g clip-path="url(#outerClip)">
    <rect width="850" height="270" fill="#0D0E14"/>
    <rect width="850" height="270" fill="url(#topGlow)"/>

    <!-- Heading -->
    <rect x="278" y="34" width="60" height="1" fill="url(#divL)"/>
    <text class="sans" x="425" y="39" text-anchor="middle" font-size="13" font-weight="700" letter-spacing="6" fill="#F3DEC2">TECH STACK</text>
    <rect x="512" y="34" width="60" height="1" fill="url(#divR)"/>

    <!-- Card 1: Python (x=32, cx=92) -->
    <g class="card c1">
      <rect x="32.5" y="66.5" width="119" height="171" rx="12" fill="#12131B" stroke="#282B3B"/>
      <rect x="48" y="66" width="88" height="1" fill="url(#cardEdge)"/>
      <g clip-path="url(#art1)">
        <rect x="32" y="66" width="120" height="114" fill="#191733"/>
        <circle cx="92" cy="122" r="48" stroke="#E6C29F" stroke-opacity="0.4" stroke-dasharray="5 5"/>
        <circle cx="78" cy="111" r="33" fill="#7C6CF6"/>
        <circle cx="68" cy="98" r="3.8" fill="#0D0E14"/>
        <circle cx="106" cy="135" r="33" fill="#D5C8FF" fill-opacity="0.92"/>
        <circle cx="116" cy="148" r="3.8" fill="#0D0E14"/>
        <rect x="32" y="144" width="120" height="36" fill="url(#artFade)"/>
      </g>
      <text class="sans" x="92" y="209" text-anchor="middle" font-size="14.5" font-weight="600" fill="#FFFFFF">Python</text>
      <text class="mono" x="92" y="226" text-anchor="middle" font-size="9.5" letter-spacing="1.2" fill="#71717A">AI · CV</text>
    </g>

    <!-- Card 2: Swift (x=165, cx=225) -->
    <g class="card c2">
      <rect x="165.5" y="66.5" width="119" height="171" rx="12" fill="#12131B" stroke="#282B3B"/>
      <rect x="181" y="66" width="88" height="1" fill="url(#cardEdge)"/>
      <g clip-path="url(#art2)">
        <rect x="165" y="66" width="120" height="114" fill="#161420"/>
        <circle cx="258" cy="91" r="8.5" fill="#F3C98B"/>
        <path d="M174 90 C212 98 242 120 264 156" stroke="#E6C29F" stroke-opacity="0.72" stroke-width="1.4"/>
        <path d="M174 106 C206 114 232 132 250 158" stroke="#D5C8FF" stroke-opacity="0.48" stroke-width="1.3"/>
        <path d="M160 186 L160 142 C194 124 234 156 290 116 L290 186 Z" fill="#2A264A"/>
        <path d="M160 186 L160 158 C198 142 232 164 290 134 L290 186 Z" fill="#E6C29F" fill-opacity="0.62"/>
        <rect x="165" y="144" width="120" height="36" fill="url(#artFade)"/>
      </g>
      <text class="sans" x="225" y="209" text-anchor="middle" font-size="14.5" font-weight="600" fill="#FFFFFF">Swift</text>
      <text class="mono" x="225" y="226" text-anchor="middle" font-size="9.5" letter-spacing="1.2" fill="#71717A">iOS</text>
    </g>

    <!-- Card 3: Node.js (x=298, cx=358) -->
    <g class="card c3">
      <rect x="298.5" y="66.5" width="119" height="171" rx="12" fill="#12131B" stroke="#282B3B"/>
      <rect x="314" y="66" width="88" height="1" fill="url(#cardEdge)"/>
      <g clip-path="url(#art3)">
        <rect x="298" y="66" width="120" height="114" fill="#131124"/>
        <polygon points="358,74 401,99 401,149 358,174 315,149 315,99" fill="#1D1A3B" stroke="#7C6CF6" stroke-opacity="0.55" stroke-width="1.2"/>
        <polygon points="358,88 389,106 389,142 358,160 327,142 327,106" stroke="#D5C8FF" stroke-opacity="0.65" stroke-width="1.2"/>
        <polygon points="358,102 377,113 377,135 358,146 339,135 339,113" fill="#7C6CF6"/>
        <polygon points="358,115 366,120 366,128 358,133 350,128 350,120" fill="#F3DEC2"/>
        <rect x="298" y="144" width="120" height="36" fill="url(#artFade)"/>
      </g>
      <text class="sans" x="358" y="209" text-anchor="middle" font-size="14.5" font-weight="600" fill="#FFFFFF">Node.js</text>
      <text class="mono" x="358" y="226" text-anchor="middle" font-size="9.5" letter-spacing="1.2" fill="#71717A">BACKEND</text>
    </g>

    <!-- Card 4: Flutter (x=431, cx=491) -->
    <g class="card c4">
      <rect x="431.5" y="66.5" width="119" height="171" rx="12" fill="#12131B" stroke="#282B3B"/>
      <rect x="447" y="66" width="88" height="1" fill="url(#cardEdge)"/>
      <g clip-path="url(#art4)">
        <rect x="431" y="66" width="120" height="114" fill="#141220"/>
        <g transform="rotate(-34 491 124)">
          <rect x="398" y="76"  width="186" height="15" fill="#2A264A"/>
          <rect x="398" y="98"  width="186" height="15" fill="#7C6CF6"/>
          <rect x="398" y="120" width="186" height="15" fill="#D5C8FF"/>
          <rect x="398" y="142" width="186" height="15" fill="#7C6CF6" fill-opacity="0.5"/>
        </g>
        <polygon points="482,95 504,95 478,122 504,149 482,149 456,122" fill="#F3DEC2" stroke="#12131B" stroke-width="2"/>
        <rect x="431" y="144" width="120" height="36" fill="url(#artFade)"/>
      </g>
      <text class="sans" x="491" y="209" text-anchor="middle" font-size="14.5" font-weight="600" fill="#FFFFFF">Flutter</text>
      <text class="mono" x="491" y="226" text-anchor="middle" font-size="9.5" letter-spacing="1.2" fill="#71717A">MOBILE</text>
    </g>

    <!-- Card 5: Solidity (x=564, cx=624) -->
    <g class="card c5">
      <rect x="564.5" y="66.5" width="119" height="171" rx="12" fill="#12131B" stroke="#282B3B"/>
      <rect x="580" y="66" width="88" height="1" fill="url(#cardEdge)"/>
      <g clip-path="url(#art5)">
        <rect x="564" y="66" width="120" height="114" fill="#15121F"/>
        <rect x="564" y="66" width="120" height="114" fill="url(#microDots)"/>
        <circle cx="624" cy="123" r="46" stroke="#7C6CF6" stroke-opacity="0.4" stroke-dasharray="4 5"/>
        <polygon points="624,79 652,122 624,138 596,122" fill="#D5C8FF"/>
        <polygon points="624,79 652,122 624,138" fill="#7C6CF6"/>
        <polygon points="596,130 624,146 652,130 624,169" fill="#E6C29F"/>
        <polygon points="624,146 652,130 624,169" fill="#F3DEC2"/>
        <rect x="564" y="144" width="120" height="36" fill="url(#artFade)"/>
      </g>
      <text class="sans" x="624" y="209" text-anchor="middle" font-size="14.5" font-weight="600" fill="#FFFFFF">Solidity</text>
      <text class="mono" x="624" y="226" text-anchor="middle" font-size="9.5" letter-spacing="1.2" fill="#71717A">WEB3</text>
    </g>

    <!-- Card 6: Docker (x=697, cx=757) -->
    <g class="card c6">
      <rect x="697.5" y="66.5" width="119" height="171" rx="12" fill="#12131B" stroke="#282B3B"/>
      <rect x="713" y="66" width="88" height="1" fill="url(#cardEdge)"/>
      <g clip-path="url(#art6)">
        <rect x="697" y="66" width="120" height="114" fill="#131120"/>
        <path d="M692 186 L692 152 C714 142 736 162 758 152 S796 146 822 156 L822 186 Z" fill="#2A264A"/>
        <path d="M718 134 H796 C794 150 778 160 757 160 C736 160 722 150 718 134 Z" fill="#7C6CF6"/>
        <rect x="725" y="118" width="13" height="13" rx="2.5" fill="#D5C8FF"/>
        <rect x="741" y="118" width="13" height="13" rx="2.5" fill="#7C6CF6" stroke="#D5C8FF" stroke-opacity="0.65"/>
        <rect x="757" y="118" width="13" height="13" rx="2.5" fill="#E6C29F"/>
        <rect x="773" y="118" width="13" height="13" rx="2.5" fill="#D5C8FF"/>
        <rect x="741" y="102" width="13" height="13" rx="2.5" fill="#F3DEC2"/>
        <rect x="757" y="102" width="13" height="13" rx="2.5" fill="#2A264A" stroke="#D5C8FF" stroke-opacity="0.65"/>
        <rect x="697" y="144" width="120" height="36" fill="url(#artFade)"/>
      </g>
      <text class="sans" x="757" y="209" text-anchor="middle" font-size="14.5" font-weight="600" fill="#FFFFFF">Docker</text>
      <text class="mono" x="757" y="226" text-anchor="middle" font-size="9.5" letter-spacing="1.2" fill="#71717A">DEVOPS</text>
    </g>
  </g>

  <rect x="0.5" y="0.5" width="849" height="269" rx="14" stroke="#1F222E"/>
</svg>
