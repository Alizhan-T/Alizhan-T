<svg xmlns="http://www.w3.org/2000/svg" width="850" height="260" viewBox="0 0 850 260" fill="none" role="img" aria-labelledby="stackTitle stackDesc">
  <title id="stackTitle">TECH STACK</title>
  <desc id="stackDesc">Compact row of six animated tech stack cards: Python, Swift, Node.js, Flutter, Solidity, Docker.</desc>
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif; }
    .mono { font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; }

    .card {
      animation: waveCard 4.8s ease-in-out infinite alternate;
    }
    .c1 { animation-delay: -1.75s; }
    .c2 { animation-delay: -1.40s; }
    .c3 { animation-delay: -1.05s; }
    .c4 { animation-delay: -0.70s; }
    .c5 { animation-delay: -0.35s; }
    .c6 { animation-delay:  0.00s; }

    @keyframes waveCard {
      0%   { transform: translateY(-5px); }
      100% { transform: translateY(5px); }
    }

    .px { animation: innerShift 4.8s ease-in-out infinite alternate; }
    .px-alt { animation: innerShiftAlt 4.8s ease-in-out infinite alternate; }
    .p1 { animation-delay: -1.75s; }
    .p2 { animation-delay: -1.40s; }
    .p3 { animation-delay: -1.05s; }
    .p4 { animation-delay: -0.70s; }
    .p5 { animation-delay: -0.35s; }
    .p6 { animation-delay:  0.00s; }

    @keyframes innerShift {
      0%   { transform: translate(-3px, -4px); }
      100% { transform: translate(3px, 4px); }
    }
    @keyframes innerShiftAlt {
      0%   { transform: translate(3px, 4px); }
      100% { transform: translate(-3px, -4px); }
    }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }
  </style>
  <defs>
    <clipPath id="outerClip"><rect x="0.5" y="0.5" width="849" height="259" rx="14"/></clipPath>
    <clipPath id="art1"><rect x="32"  y="62" width="138" height="114" rx="11"/></clipPath>
    <clipPath id="art2"><rect x="182" y="70" width="108" height="108" rx="11"/></clipPath>
    <clipPath id="art3"><rect x="302" y="58" width="132" height="118" rx="11"/></clipPath>
    <clipPath id="art4"><rect x="446" y="70" width="114" height="108" rx="11"/></clipPath>
    <clipPath id="art5"><rect x="572" y="60" width="128" height="116" rx="11"/></clipPath>
    <clipPath id="art6"><rect x="712" y="68" width="106" height="110" rx="11"/></clipPath>

    <radialGradient id="topGlow" cx="425" cy="0" r="380" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7C6CF6" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#7C6CF6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="divL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F3DEC2" stop-opacity="0"/>
      <stop offset="1" stop-color="#F3DEC2" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="divR" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F3DEC2" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#F3DEC2" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="artFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#12131B" stop-opacity="0"/>
      <stop offset="1" stop-color="#12131B" stop-opacity="1"/>
    </linearGradient>
    <pattern id="microDots" width="12" height="12" patternUnits="userSpaceOnUse">
      <circle cx="6" cy="6" r="1" fill="#D5C8FF" fill-opacity="0.2"/>
    </pattern>
  </defs>

  <g clip-path="url(#outerClip)">
    <rect width="850" height="260" fill="#0D0E14"/>
    <rect width="850" height="260" fill="url(#topGlow)"/>

    <rect x="278" y="34" width="60" height="1" fill="url(#divL)"/>
    <text class="sans" x="425" y="39" text-anchor="middle" font-size="13" font-weight="700" letter-spacing="6" fill="#F3DEC2">TECH STACK</text>
    <rect x="512" y="34" width="60" height="1" fill="url(#divR)"/>

    <!-- Card 1: Python -->
    <g class="card c1">
      <rect x="32.5" y="62.5" width="137" height="172" rx="12" fill="#12131B" stroke="#1F222E"/>
      <g clip-path="url(#art1)">
        <rect x="32" y="62" width="138" height="114" fill="#191733"/>
        <circle cx="101" cy="118" r="52" stroke="#E6C29F" stroke-opacity="0.38" stroke-dasharray="6 5"/>
        <g class="px p1">
          <circle cx="86" cy="107" r="35" fill="#7C6CF6"/>
          <circle cx="76" cy="93" r="4" fill="#0D0E14"/>
        </g>
        <g class="px-alt p1">
          <circle cx="116" cy="133" r="35" fill="#D5C8FF" fill-opacity="0.92"/>
          <circle cx="126" cy="147" r="4" fill="#0D0E14"/>
        </g>
        <rect x="32" y="140" width="138" height="36" fill="url(#artFade)"/>
      </g>
      <text class="sans" x="101" y="206" text-anchor="middle" font-size="14.5" font-weight="600" fill="#FFFFFF">Python</text>
      <text class="mono" x="101" y="223" text-anchor="middle" font-size="9.5" letter-spacing="1.2" fill="#71717A">AI · CV</text>
    </g>

    <!-- Card 2: Swift -->
    <g class="card c2">
      <rect x="182.5" y="70.5" width="107" height="166" rx="12" fill="#12131B" stroke="#1F222E"/>
      <g clip-path="url(#art2)">
        <rect x="182" y="70" width="108" height="108" fill="#161420"/>
        <g class="px p2">
          <circle cx="264" cy="92" r="8.5" fill="#F3C98B"/>
          <path d="M188 92 C226 100 256 120 278 156" stroke="#E6C29F" stroke-opacity="0.72" stroke-width="1.4"/>
        </g>
        <g class="px-alt p2">
          <path d="M174 186 L174 142 C206 124 244 156 300 116 L300 186 Z" fill="#2A264A"/>
          <path d="M174 186 L174 158 C210 142 242 164 300 134 L300 186 Z" fill="#E6C29F" fill-opacity="0.62"/>
        </g>
        <rect x="182" y="144" width="108" height="34" fill="url(#artFade)"/>
      </g>
      <text class="sans" x="236" y="208" text-anchor="middle" font-size="14.5" font-weight="600" fill="#FFFFFF">Swift</text>
      <text class="mono" x="236" y="225" text-anchor="middle" font-size="9.5" letter-spacing="1.2" fill="#71717A">iOS</text>
    </g>

    <!-- Card 3: Node.js -->
    <g class="card c3">
      <rect x="302.5" y="58.5" width="131" height="176" rx="12" fill="#12131B" stroke="#1F222E"/>
      <g clip-path="url(#art3)">
        <rect x="302" y="58" width="132" height="118" fill="#131124"/>
        <g class="px-alt p3">
          <polygon points="368,68 412,93 412,143 368,168 324,143 324,93" fill="#1D1A3B" stroke="#7C6CF6" stroke-opacity="0.55" stroke-width="1.2"/>
          <polygon points="368,82 399,100 399,136 368,154 337,136 337,100" stroke="#D5C8FF" stroke-opacity="0.65" stroke-width="1.2"/>
        </g>
        <g class="px p3">
          <polygon points="368,96 387,107 387,129 368,140 349,129 349,107" fill="#7C6CF6"/>
          <polygon points="368,109 376,114 376,122 368,127 360,122 360,114" fill="#F3DEC2"/>
        </g>
        <rect x="302" y="140" width="132" height="36" fill="url(#artFade)"/>
      </g>
      <text class="sans" x="368" y="206" text-anchor="middle" font-size="14.5" font-weight="600" fill="#FFFFFF">Node.js</text>
      <text class="mono" x="368" y="223" text-anchor="middle" font-size="9.5" letter-spacing="1.2" fill="#71717A">BACKEND</text>
    </g>

    <!-- Card 4: Flutter -->
    <g class="card c4">
      <rect x="446.5" y="70.5" width="113" height="166" rx="12" fill="#12131B" stroke="#1F222E"/>
      <g clip-path="url(#art4)">
        <rect x="446" y="70" width="114" height="108" fill="#141220"/>
        <g class="px-alt p4">
          <g transform="rotate(-34 503 124)">
            <rect x="410" y="76"  width="186" height="15" fill="#2A264A"/>
            <rect x="410" y="98"  width="186" height="15" fill="#7C6CF6"/>
            <rect x="410" y="120" width="186" height="15" fill="#D5C8FF"/>
            <rect x="410" y="142" width="186" height="15" fill="#7C6CF6" fill-opacity="0.5"/>
          </g>
        </g>
        <g class="px p4">
          <polygon points="494,95 516,95 490,122 516,149 494,149 468,122" fill="#F3DEC2" stroke="#12131B" stroke-width="2"/>
        </g>
        <rect x="446" y="144" width="114" height="34" fill="url(#artFade)"/>
      </g>
      <text class="sans" x="503" y="208" text-anchor="middle" font-size="14.5" font-weight="600" fill="#FFFFFF">Flutter</text>
      <text class="mono" x="503" y="225" text-anchor="middle" font-size="9.5" letter-spacing="1.2" fill="#71717A">MOBILE</text>
    </g>

    <!-- Card 5: Solidity -->
    <g class="card c5">
      <rect x="572.5" y="60.5" width="127" height="174" rx="12" fill="#12131B" stroke="#1F222E"/>
      <g clip-path="url(#art5)">
        <rect x="572" y="60" width="128" height="116" fill="#15121F"/>
        <rect x="572" y="60" width="128" height="116" fill="url(#microDots)"/>
        <circle class="px-alt p5" cx="636" cy="118" r="46" stroke="#7C6CF6" stroke-opacity="0.4" stroke-dasharray="4 5"/>
        <g class="px p5">
          <polygon points="636,74 664,117 636,133 608,117" fill="#D5C8FF"/>
          <polygon points="636,74 664,117 636,133" fill="#7C6CF6"/>
          <polygon points="608,125 636,141 664,125 636,164" fill="#E6C29F"/>
          <polygon points="636,141 664,125 636,164" fill="#F3DEC2"/>
        </g>
        <rect x="572" y="140" width="128" height="36" fill="url(#artFade)"/>
      </g>
      <text class="sans" x="636" y="206" text-anchor="middle" font-size="14.5" font-weight="600" fill="#FFFFFF">Solidity</text>
      <text class="mono" x="636" y="223" text-anchor="middle" font-size="9.5" letter-spacing="1.2" fill="#71717A">WEB3</text>
    </g>

    <!-- Card 6: Docker -->
    <g class="card c6">
      <rect x="712.5" y="68.5" width="105" height="168" rx="12" fill="#12131B" stroke="#1F222E"/>
      <g clip-path="url(#art6)">
        <rect x="712" y="68" width="106" height="110" fill="#131120"/>
        <g class="px-alt p6">
          <path d="M704 186 L704 152 C726 142 746 162 768 152 S804 146 826 156 L826 186 Z" fill="#2A264A"/>
        </g>
        <g class="px p6">
          <path d="M726 134 H804 C802 150 786 160 765 160 C744 160 730 150 726 134 Z" fill="#7C6CF6"/>
          <rect x="733" y="118" width="13" height="13" rx="2.5" fill="#D5C8FF"/>
          <rect x="749" y="118" width="13" height="13" rx="2.5" fill="#7C6CF6" stroke="#D5C8FF" stroke-opacity="0.65"/>
          <rect x="765" y="118" width="13" height="13" rx="2.5" fill="#E6C29F"/>
          <rect x="781" y="118" width="13" height="13" rx="2.5" fill="#D5C8FF"/>
          <rect x="749" y="102" width="13" height="13" rx="2.5" fill="#F3DEC2"/>
          <rect x="765" y="102" width="13" height="13" rx="2.5" fill="#2A264A" stroke="#D5C8FF" stroke-opacity="0.65"/>
        </g>
        <rect x="712" y="146" width="106" height="32" fill="url(#artFade)"/>
      </g>
      <text class="sans" x="765" y="208" text-anchor="middle" font-size="14.5" font-weight="600" fill="#FFFFFF">Docker</text>
      <text class="mono" x="765" y="225" text-anchor="middle" font-size="9.5" letter-spacing="1.2" fill="#71717A">DEVOPS</text>
    </g>
  </g>

  <rect x="0.5" y="0.5" width="849" height="259" rx="14" stroke="#1F222E"/>
</svg>
