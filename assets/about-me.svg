<svg xmlns="http://www.w3.org/2000/svg" width="850" height="240" viewBox="0 0 850 240" fill="none" role="img" aria-labelledby="aboutTitle aboutDesc">
  <title id="aboutTitle">About me — Hello, World</title>
  <desc id="aboutDesc">Software Engineering student at AITU in Astana, Kazakhstan, exploring AI and Computer Vision, native iOS, backend and Web3. Always curious, always shipping something new.</desc>
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif; }
    .mono { font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; }
    .float-a { animation: hover 5s ease-in-out infinite; }
    .float-b { animation: hover-b 6.5s ease-in-out infinite; }
    @keyframes hover { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(6px, -8px); } }
    @keyframes hover-b { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(-7px, 6px); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <defs>
    <clipPath id="aboutClip">
      <rect x="0.5" y="0.5" width="849" height="239" rx="14"/>
    </clipPath>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r=".9" fill="#FFFFFF" fill-opacity=".08"/>
    </pattern>
    <radialGradient id="dotsFade" cx="425" cy="120" r="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <mask id="dotsMask">
      <rect width="850" height="240" fill="url(#dotsFade)"/>
    </mask>
    <radialGradient id="aboutGlow" cx="425" cy="110" r="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7C6CF6" stop-opacity=".18"/>
      <stop offset="1" stop-color="#7C6CF6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tagPeach" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F3DEC2"/>
      <stop offset="1" stop-color="#E6C29F"/>
    </linearGradient>
    <linearGradient id="headFill" x1="270" y1="0" x2="580" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#D5C8FF"/>
    </linearGradient>
  </defs>

  <g clip-path="url(#aboutClip)">
    <rect width="850" height="240" fill="#0D0E14"/>
    <rect width="850" height="240" fill="url(#dots)" mask="url(#dotsMask)"/>
    <rect width="850" height="240" fill="url(#aboutGlow)"/>

    <!-- eyebrow -->
    <text class="mono" x="425" y="54" text-anchor="middle" font-size="11" letter-spacing="6" fill="#E6C29F">ABOUT ME</text>

    <!-- Figma selection frame around heading -->
    <rect x="271.5" y="74.5" width="307" height="50" stroke="#7C6CF6" stroke-opacity=".8"/>
    <g fill="#0D0E14" stroke="#7C6CF6">
      <rect x="268.5" y="71.5" width="6" height="6"/>
      <rect x="575.5" y="71.5" width="6" height="6"/>
      <rect x="268.5" y="121.5" width="6" height="6"/>
      <rect x="575.5" y="121.5" width="6" height="6"/>
    </g>

    <!-- heading -->
    <text class="sans" x="425" y="111" text-anchor="middle" font-size="40" font-weight="800" letter-spacing="-1" fill="url(#headFill)">Hello, World</text>

    <!-- bio -->
    <text class="sans" x="425" y="156" text-anchor="middle" font-size="15" fill="#A1A1AA">Software Engineering student @ <tspan fill="#FFFFFF" font-weight="600">AITU</tspan> · Astana, Kazakhstan</text>
    <text class="sans" x="425" y="178" text-anchor="middle" font-size="15" fill="#A1A1AA">Exploring AI &amp; Computer Vision, native iOS, backend and Web3.</text>

    <!-- slogan -->
    <text class="sans" x="425" y="211" text-anchor="middle" font-size="13" font-style="italic" fill="#71717A">Always curious, always shipping something new.</text>

    <!-- Figma cursor: Alizhan -->
    <g transform="translate(92 66)">
      <g class="float-a">
        <path d="M0 0 L0 24 L6.5 18 L11 28 L15 26.2 L10.6 16.6 L19 16.6 Z" fill="#FFFFFF" stroke="#0D0E14" stroke-width="1.5" stroke-linejoin="round"/>
        <g transform="translate(16 28) rotate(-6)">
          <rect width="80" height="26" rx="8" fill="url(#tagPeach)"/>
          <text class="sans" x="40" y="17.5" text-anchor="middle" font-size="13" font-weight="600" fill="#1B140C">Alizhan</text>
        </g>
      </g>
    </g>

    <!-- Figma cursor: visitor -->
    <g transform="translate(704 116)">
      <g class="float-b">
        <path d="M0 0 L0 24 L6.5 18 L11 28 L15 26.2 L10.6 16.6 L19 16.6 Z" fill="#7C6CF6" stroke="#0D0E14" stroke-width="1.5" stroke-linejoin="round"/>
        <g transform="translate(16 28) rotate(5)">
          <rect width="52" height="24" rx="8" fill="#7C6CF6"/>
          <text class="sans" x="26" y="16.5" text-anchor="middle" font-size="12" font-weight="600" fill="#FFFFFF">you</text>
        </g>
      </g>
    </g>
  </g>

  <rect x="0.5" y="0.5" width="849" height="239" rx="14" stroke="#1F222E"/>
</svg>
