        <tspan x="425" y="112.6" xml:space="preserve">       XK0xxXkX x0KX       </tspan>
        <tspan x="425" y="122.8" xml:space="preserve">       koo0.     ook       </tspan>
        <tspan x="425" y="133.0" xml:space="preserve">      WXk0N     N0kXW      </tspan>
        <tspan x="425" y="143.2" xml:space="preserve">       koo0.   .0ook       </tspan>
        <tspan x="425" y="153.4" xml:space="preserve">       XK0xxXkXxx0KX       </tspan>
