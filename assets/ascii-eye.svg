<svg xmlns="http://www.w3.org/2000/svg" width="850" height="260" viewBox="0 0 850 260" fill="none" role="img" aria-labelledby="eyeTitle eyeDesc">
  <title id="eyeTitle">ASCII Vision — Watching Cursor</title>
  <desc id="eyeDesc">Animated ASCII-art eye built from monospace code characters whose iris smoothly tracks a roaming cursor across the dark card.</desc>
  <style>
    .mono { font-family: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif; }

    /* Synchronized 14s gaze cycle: cursor roams 5 waypoints with natural pauses, ASCII iris locks onto it */
    .track-cursor {
      animation: cursorMove 14s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
    }
    .eye-iris {
      animation: gazeTrack 14s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
    }

    @keyframes cursorMove {
      0%, 14%   { transform: translate(118px, 126px); }
      22%, 36%  { transform: translate(186px, 40px); }
      44%, 58%  { transform: translate(652px, 42px); }
      66%, 80%  { transform: translate(718px, 134px); }
      88%, 94%  { transform: translate(232px, 204px); }
      100%      { transform: translate(118px, 126px); }
    }

    @keyframes gazeTrack {
      0%, 14%   { transform: translate(-38px, 0px); }
      22%, 36%  { transform: translate(-26px, -13px); }
      44%, 58%  { transform: translate(26px, -13px); }
      66%, 80%  { transform: translate(38px, 2px); }
      88%, 94%  { transform: translate(-22px, 13px); }
      100%      { transform: translate(-38px, 0px); }
    }

    /* Subtle natural blink every 7s */
    .blink-lid-top {
      transform-origin: 425px 40px;
      animation: blinkTop 7s ease-in-out infinite;
    }
    .blink-lid-bot {
      transform-origin: 425px 220px;
      animation: blinkBot 7s ease-in-out infinite;
    }
    @keyframes blinkTop {
      0%, 91%, 100% { transform: scaleY(0); }
      95%           { transform: scaleY(1); }
    }
    @keyframes blinkBot {
      0%, 91%, 100% { transform: scaleY(0); }
      95%           { transform: scaleY(1); }
    }

    .pulse-dot { animation: pulse 2.6s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { opacity: 0.45; } 50% { opacity: 1; } }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
      .track-cursor { transform: translate(652px, 42px); }
      .eye-iris { transform: translate(26px, -13px); }
    }
  </style>
  <defs>
    <clipPath id="cardClip">
      <rect x="0.5" y="0.5" width="849" height="259" rx="14"/>
    </clipPath>
    <!-- Almond eye opening clipPath so moving ASCII iris stays naturally inside eyelids -->
    <clipPath id="eyeAperture">
      <path d="M256 130 C306 60, 544 60, 594 130 C544 200, 306 200, 256 130 Z"/>
    </clipPath>
    <radialGradient id="eyeBg" cx="425" cy="130" r="440" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#141524"/>
      <stop offset="0.55" stop-color="#0D0E14"/>
      <stop offset="1" stop-color="#0B0C10"/>
    </radialGradient>
    <radialGradient id="irisAura" cx="425" cy="130" r="170" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7C6CF6" stop-opacity="0.24"/>
      <stop offset="0.6" stop-color="#E6C29F" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#7C6CF6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="irisGrad" x1="370" y1="80" x2="480" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#D5C8FF"/>
      <stop offset="0.55" stop-color="#9B8CFC"/>
      <stop offset="1" stop-color="#E6C29F"/>
    </linearGradient>
    <filter id="irisGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <radialGradient id="ptrGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#E6C29F" stop-opacity="0.34"/>
      <stop offset="0.6" stop-color="#7C6CF6" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#7C6CF6" stop-opacity="0"/>
    </radialGradient>
    <filter id="ptrShadow" x="-35%" y="-35%" width="180%" height="180%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <g clip-path="url(#cardClip)">
    <rect width="850" height="260" fill="url(#eyeBg)"/>
    <rect width="850" height="260" fill="url(#irisAura)"/>

    <!-- Subtle top label -->
    <text class="mono" x="28" y="30" font-size="10.5" letter-spacing="2.5" fill="#71717A">VISION // ASCII</text>
    <circle class="pulse-dot" cx="814" cy="26" r="3" fill="#7C6CF6"/>
    <text class="mono" x="802" y="30" text-anchor="end" font-size="10" letter-spacing="1.8" fill="#71717A">TRACKING</text>

    <!-- Movable ASCII Iris + Pupil clipped inside the almond eye aperture -->
    <g clip-path="url(#eyeAperture)">
      <g class="eye-iris">
        <circle cx="425" cy="130" r="46" fill="#7C6CF6" fill-opacity="0.10"/>
        <text class="mono" text-anchor="middle" font-size="10.5" font-weight="600" fill="url(#irisGrad)" filter="url(#irisGlow)">
          <tspan x="425" y="71.8" xml:space="preserve">                           </tspan>
          <tspan x="425" y="82.0" xml:space="preserve">            .:.            </tspan>
          <tspan x="425" y="92.2" xml:space="preserve">        :.N0KNK0N.:        </tspan>
          <tspan x="425" y="102.4" xml:space="preserve">       :00KkokokK00:       </tspan>
          <tspan x="425" y="112.6" xml:space="preserve">      :NKxoKkNk  xKN:      </tspan>
          <tspan x="425" y="122.8" xml:space="preserve">     :0kokX.     kok0:     </tspan>
          <tspan x="425" y="133.0" xml:space="preserve">     .WX0KN     NK0XW.     </tspan>
          <tspan x="425" y="143.2" xml:space="preserve">     :0kokX.   .Xkok0:     </tspan>
          <tspan x="425" y="153.4" xml:space="preserve">      :NKxoKkNkKoxKN:      </tspan>
          <tspan x="425" y="163.6" xml:space="preserve">       :00KkokokK00:       </tspan>
          <tspan x="425" y="173.8" xml:space="preserve">        :.N0KNK0N.:        </tspan>
          <tspan x="425" y="184.0" xml:space="preserve">            .:.            </tspan>
          <tspan x="425" y="194.2" xml:space="preserve">                           </tspan>
        </text>
        <text class="mono" text-anchor="middle" font-size="10.5" font-weight="700" fill="#FFFFFF">
          <tspan x="425" y="71.8" xml:space="preserve">                           </tspan>
          <tspan x="425" y="82.0" xml:space="preserve">                           </tspan>
          <tspan x="425" y="92.2" xml:space="preserve">                           </tspan>
          <tspan x="425" y="102.4" xml:space="preserve">                           </tspan>
          <tspan x="425" y="112.6" xml:space="preserve">               **          </tspan>
          <tspan x="425" y="122.8" xml:space="preserve">              *@*          </tspan>
          <tspan x="425" y="133.0" xml:space="preserve">                           </tspan>
          <tspan x="425" y="143.2" xml:space="preserve">                           </tspan>
          <tspan x="425" y="153.4" xml:space="preserve">                           </tspan>
          <tspan x="425" y="163.6" xml:space="preserve">                           </tspan>
          <tspan x="425" y="173.8" xml:space="preserve">                           </tspan>
          <tspan x="425" y="184.0" xml:space="preserve">                           </tspan>
          <tspan x="425" y="194.2" xml:space="preserve">                           </tspan>
        </text>
      </g>

      <!-- Eyelid blink curtains -->
      <rect class="blink-lid-top" x="240" y="40" width="370" height="92" fill="#0D0E14"/>
      <rect class="blink-lid-bot" x="240" y="128" width="370" height="92" fill="#0D0E14"/>
    </g>

    <!-- Outer ASCII Eye Contour & Eyelid Shading -->
    <text class="mono" text-anchor="middle" font-size="10.5" fill="#A1A1AA" fill-opacity="0.88">
        <tspan x="425" y="31.0" xml:space="preserve">                          .'',ooddddddddddoo,''.                          </tspan>
        <tspan x="425" y="41.2" xml:space="preserve">                      .'clodxxk000KKKKKK000kxxdolc'.                      </tspan>
        <tspan x="425" y="51.4" xml:space="preserve">                   .,cldxk0KKXNkkk000000kkkNXKK0kxdlc,.                   </tspan>
        <tspan x="425" y="61.6" xml:space="preserve">                .':loxk0Kk00KKXXNNN    NNNXXKK00kK0kxol:'.                </tspan>
        <tspan x="425" y="71.8" xml:space="preserve">              ';:ldx0xk0KX                      XK0kx0xdl:;'              </tspan>
        <tspan x="425" y="82.0" xml:space="preserve">            ',:loxxk0X                              X0kxxol:,'            </tspan>
        <tspan x="425" y="92.2" xml:space="preserve">          .,;cooxkK                                    Kkxooc;,.          </tspan>
        <tspan x="425" y="102.4" xml:space="preserve">          ,:loxk                                          kxol:,          </tspan>
        <tspan x="425" y="112.6" xml:space="preserve">       ',;:lox'.                                          .'xol:;,'       </tspan>
        <tspan x="425" y="122.8" xml:space="preserve">      ,;cll;,''.                                          .'',;llc;,      </tspan>
        <tspan x="425" y="133.0" xml:space="preserve">     .;cox;;,''.                                          .'',;;xoc;.     </tspan>
        <tspan x="425" y="143.2" xml:space="preserve">      ,;cl:;,''.                                          .'',;:lc;,      </tspan>
        <tspan x="425" y="153.4" xml:space="preserve">       ',;,;cl'.                                          .'lc;,;,'       </tspan>
        <tspan x="425" y="163.6" xml:space="preserve">          ',;:co                                          oc:;,'          </tspan>
        <tspan x="425" y="173.8" xml:space="preserve">           ',;:clod                                    dolc:;,'           </tspan>
        <tspan x="425" y="184.0" xml:space="preserve">            .',;:clood                              doolc:;,'.            </tspan>
        <tspan x="425" y="194.2" xml:space="preserve">              .',;;:cloodx                      xdoolc:;;,'.              </tspan>
        <tspan x="425" y="204.4" xml:space="preserve">                 .',;::cllooddxxxxx    xxxxxddoollc::;,'.                 </tspan>
        <tspan x="425" y="214.6" xml:space="preserve">                   .'',;;::ccllloooooooooolllcc::;;,''.                   </tspan>
        <tspan x="425" y="224.8" xml:space="preserve">                       .'',,;;:::::cccc:::::;;,,''.                       </tspan>
        <tspan x="425" y="235.0" xml:space="preserve">                           ..''',,,,,,,,,,'''..                           </tspan>
    </text>

    <!-- Roaming Cursor that the ASCII eye continuously watches -->
    <g class="track-cursor" filter="url(#ptrShadow)">
      <circle cx="5" cy="8" r="24" fill="url(#ptrGlow)"/>
      <path d="M0 0 L0 21 L5.6 15.8 L9.6 24.5 L13.2 22.8 L9.3 14.3 L16.6 14.3 Z" fill="#F3DEC2" stroke="#0D0E14" stroke-width="1.5" stroke-linejoin="round"/>
    </g>

    <!-- Bottom terminal whisper -->
    <text class="mono" x="28" y="238" font-size="11" fill="#71717A"><tspan fill="#7C6CF6">&gt; </tspan>computer_vision.watch(cursor)</text>
  </g>

  <rect x="0.5" y="0.5" width="849" height="259" rx="14" stroke="#1F222E"/>
</svg>
