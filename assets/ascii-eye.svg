<svg xmlns="http://www.w3.org/2000/svg" width="850" height="250" viewBox="0 0 850 250" fill="none" role="img" aria-label="Minimalist monochrome ASCII eye">
  <style>
    .mono { font-family: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace; }

    /* Natural, unhurried human eye glances (no fake cursor, no neon effects) */
    .iris {
      animation: glance 13s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
    }
    @keyframes glance {
      0%, 16%   { transform: translate(0px, 0px); }
      24%, 38%  { transform: translate(-34px, -4px); }
      46%, 60%  { transform: translate(34px, -6px); }
      68%, 80%  { transform: translate(18px, 10px); }
      88%, 100% { transform: translate(0px, 0px); }
    }

    .lid-top {
      transform-origin: 425px 38px;
      animation: blink 6.5s ease-in-out infinite;
    }
    .lid-bot {
      transform-origin: 425px 212px;
      animation: blink 6.5s ease-in-out infinite;
    }
    @keyframes blink {
      0%, 92%, 100% { transform: scaleY(0); }
      95.5%         { transform: scaleY(1); }
    }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }
  </style>
  <defs>
    <clipPath id="cardClip">
      <rect x="0.5" y="0.5" width="849" height="249" rx="14"/>
    </clipPath>
    <clipPath id="eyeOpen">
      <path d="M256 126 C306 58, 544 58, 594 126 C544 194, 306 194, 256 126 Z"/>
    </clipPath>
  </defs>

  <g clip-path="url(#cardClip)">
    <rect width="850" height="250" fill="#0B0C10"/>

    <g clip-path="url(#eyeOpen)">
      <g class="iris">
        <text class="mono" text-anchor="middle" font-size="10.5" fill="#D4D4D8">
        <tspan x="425" y="71.8" xml:space="preserve">                           </tspan>
        <tspan x="425" y="82.0" xml:space="preserve">                           </tspan>
