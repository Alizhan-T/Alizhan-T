        <tspan x="425" y="194.2" xml:space="preserve">                           </tspan>
        </text>
      </g>
      <rect class="lid-top" x="240" y="38" width="370" height="88" fill="#0B0C10"/>
      <rect class="lid-bot" x="240" y="124" width="370" height="88" fill="#0B0C10"/>
    </g>

    <text class="mono" text-anchor="middle" font-size="10.5" fill="#8E8E93">
      <tspan x="425" y="33.0" xml:space="preserve">                         .''cllloooooooolllc''.                         </tspan>
