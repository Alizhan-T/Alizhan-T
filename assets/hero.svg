<svg xmlns="http://www.w3.org/2000/svg" width="850" height="210" viewBox="0 0 850 210" fill="none" role="img" aria-labelledby="heroTitle heroDesc">
  <title id="heroTitle">Alizhan Toleukhan — iOS &amp; Full-Stack Engineer</title>
  <desc id="heroDesc">Dark hero card with an animated 3D vortex funnel, Alizhan Toleukhan headline, and terminal prompt listing shipped projects: FireWatch-AI, jas-crm, KitchenApp.</desc>
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif; }
    .mono { font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; }

    .vortex-sway {
      transform-origin: 425px 200px;
      animation: sway 9s ease-in-out infinite;
    }
    @keyframes sway {
      0%, 100% { transform: translateX(0px) rotate(-1.1deg); }
      50% { transform: translateX(6px) rotate(1.1deg); }
    }

    .r01 { animation: spin01 9.8s linear infinite; }
    .r02 { animation: spin02 9.2s linear infinite; }
    .r03 { animation: spin03 8.5s linear infinite; }
    .r04 { animation: spin04 7.8s linear infinite; }
    .r05 { animation: spin05 7.2s linear infinite; }
    .r06 { animation: spin06 6.6s linear infinite; }
    .r07 { animation: spin07 6.0s linear infinite; }
    .r08 { animation: spin08 5.5s linear infinite; }
    .r09 { animation: spin09 5.0s linear infinite; }
    .r10 { animation: spin10 4.5s linear infinite; }
    .r11 { animation: spin11 4.1s linear infinite; }
    .r12 { animation: spin12 3.7s linear infinite; }

    @keyframes spin01 { from { stroke-dashoffset: 0; } to { stroke-dashoffset: -379.7; } }
    @keyframes spin02 { from { stroke-dashoffset: 0; } to { stroke-dashoffset: -343.9; } }
    @keyframes spin03 { from { stroke-dashoffset: 0; } to { stroke-dashoffset: -308.1; } }
    @keyframes spin04 { from { stroke-dashoffset: 0; } to { stroke-dashoffset: -272.4; } }
    @keyframes spin05 { from { stroke-dashoffset: 0; } to { stroke-dashoffset: -236.6; } }
    @keyframes spin06 { from { stroke-dashoffset: 0; } to { stroke-dashoffset: -203.8; } }
    @keyframes spin07 { from { stroke-dashoffset: 0; } to { stroke-dashoffset: -260.6; } }
    @keyframes spin08 { from { stroke-dashoffset: 0; } to { stroke-dashoffset: -219.4; } }
    @keyframes spin09 { from { stroke-dashoffset: 0; } to { stroke-dashoffset: -182.0; } }
    @keyframes spin10 { from { stroke-dashoffset: 0; } to { stroke-dashoffset: -149.4; } }
    @keyframes spin11 { from { stroke-dashoffset: 0; } to { stroke-dashoffset: -120.6; } }
    @keyframes spin12 { from { stroke-dashoffset: 0; } to { stroke-dashoffset: -95.7; } }

    .cursor-blink { animation: blink 1.15s ease-in-out infinite; }
    @keyframes blink {
      0%, 45% { opacity: 1; }
      55%, 95% { opacity: 0.1; }
      100% { opacity: 1; }
    }

    .glow-breath { animation: breath 6s ease-in-out infinite; }
    @keyframes breath {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 0.85; }
    }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }
  </style>
  <defs>
    <clipPath id="heroClip">
      <rect x="0.5" y="0.5" width="849" height="209" rx="14"/>
    </clipPath>
    <radialGradient id="bgRadial" cx="425" cy="98" r="450" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#171929"/>
      <stop offset="0.55" stop-color="#0D0E14"/>
      <stop offset="1" stop-color="#0B0C10"/>
    </radialGradient>
    <radialGradient id="indigoAura" cx="425" cy="96" r="280" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7C6CF6" stop-opacity="0.25"/>
      <stop offset="0.55" stop-color="#7C6CF6" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#7C6CF6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="peachAura" cx="425" cy="185" r="180" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#E6C29F" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#E6C29F" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="peachText" x1="0" y1="78" x2="0" y2="122" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F3C98B"/>
      <stop offset="1" stop-color="#E6C29F"/>
    </linearGradient>
    <filter id="textGlow" x="-15%" y="-70%" width="130%" height="240%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <g clip-path="url(#heroClip)">
    <rect width="850" height="210" fill="url(#bgRadial)"/>
    <rect class="glow-breath" width="850" height="210" fill="url(#indigoAura)"/>
    <rect width="850" height="210" fill="url(#peachAura)"/>

    <!-- 3D rotating vortex funnel (12 tilted elliptical layers) -->
    <g class="vortex-sway" stroke-linecap="round">
      <g stroke="#94A3B8" stroke-opacity="0.08" stroke-width="1">
        <ellipse cx="425" cy="24" rx="276" ry="38" transform="rotate(-6.5 425 24)"/>
        <ellipse cx="430" cy="38" rx="250" ry="34" transform="rotate(-6.5 430 38)"/>
        <ellipse cx="434" cy="52" rx="224" ry="31" transform="rotate(-6.5 434 52)"/>
        <ellipse cx="436" cy="66" rx="198" ry="27" transform="rotate(-6 436 66)"/>
        <ellipse cx="435" cy="80" rx="172" ry="24" transform="rotate(-6 435 80)"/>
        <ellipse cx="432" cy="95" rx="148" ry="21" transform="rotate(-5.5 432 95)"/>
        <ellipse cx="428" cy="110" rx="126" ry="18" transform="rotate(-5.5 428 110)"/>
        <ellipse cx="423" cy="125" rx="106" ry="15" transform="rotate(-5 423 125)"/>
        <ellipse cx="419" cy="140" rx="88" ry="13" transform="rotate(-5 419 140)"/>
        <ellipse cx="417" cy="155" rx="72" ry="11" transform="rotate(-4.5 417 155)"/>
        <ellipse cx="419" cy="170" rx="58" ry="9" transform="rotate(-4.5 419 170)"/>
        <ellipse cx="423" cy="185" rx="46" ry="7.5" transform="rotate(-4 423 185)"/>
      </g>

      <ellipse class="r01" cx="425" cy="24" rx="276" ry="38" transform="rotate(-6.5 425 24)" stroke="#94A3B8" stroke-opacity="0.32" stroke-width="1.2" stroke-dasharray="159.5 53.2 91.1 75.9"/>
      <ellipse class="r02" cx="430" cy="38" rx="250" ry="34" transform="rotate(-6.5 430 38)" stroke="#E6C29F" stroke-opacity="0.38" stroke-width="1.3" stroke-dasharray="144.5 48.2 82.5 68.7"/>
      <ellipse class="r03" cx="434" cy="52" rx="224" ry="31" transform="rotate(-6.5 434 52)" stroke="#94A3B8" stroke-opacity="0.34" stroke-width="1.2" stroke-dasharray="129.4 43.1 74.0 61.6"/>
      <ellipse class="r04" cx="436" cy="66" rx="198" ry="27" transform="rotate(-6 436 66)" stroke="#D5C8FF" stroke-opacity="0.28" stroke-width="1.1" stroke-dasharray="114.4 38.1 65.4 54.5"/>
      <ellipse class="r05" cx="435" cy="80" rx="172" ry="24" transform="rotate(-6 435 80)" stroke="#E6C29F" stroke-opacity="0.42" stroke-width="1.3" stroke-dasharray="99.4 33.1 56.8 47.3"/>
      <ellipse class="r06" cx="432" cy="95" rx="148" ry="21" transform="rotate(-5.5 432 95)" stroke="#94A3B8" stroke-opacity="0.36" stroke-width="1.2" stroke-dasharray="85.6 28.5 48.9 40.8"/>
      <ellipse class="r07" cx="428" cy="110" rx="126" ry="18" transform="rotate(-5.5 428 110)" stroke="#E6C29F" stroke-opacity="0.46" stroke-width="1.3" stroke-dasharray="109.5 36.5 62.6 52.0"/>
      <ellipse class="r08" cx="423" cy="125" rx="106" ry="15" transform="rotate(-5 423 125)" stroke="#94A3B8" stroke-opacity="0.40" stroke-width="1.2" stroke-dasharray="92.1 30.7 52.7 43.9"/>
      <ellipse class="r09" cx="419" cy="140" rx="88" ry="13" transform="rotate(-5 419 140)" stroke="#7C6CF6" stroke-opacity="0.44" stroke-width="1.3" stroke-dasharray="76.5 25.5 43.7 36.3"/>
      <ellipse class="r10" cx="417" cy="155" rx="72" ry="11" transform="rotate(-4.5 417 155)" stroke="#E6C29F" stroke-opacity="0.50" stroke-width="1.35" stroke-dasharray="62.7 20.9 35.8 30.0"/>
      <ellipse class="r11" cx="419" cy="170" rx="58" ry="9" transform="rotate(-4.5 419 170)" stroke="#94A3B8" stroke-opacity="0.44" stroke-width="1.2" stroke-dasharray="50.6 16.9 28.9 24.2"/>
      <ellipse class="r12" cx="423" cy="185" rx="46" ry="7.5" transform="rotate(-4 423 185)" stroke="#F3C98B" stroke-opacity="0.52" stroke-width="1.3" stroke-dasharray="40.2 13.4 23.0 19.1"/>
    </g>

    <ellipse cx="425" cy="102" rx="280" ry="38" fill="#0B0C10" fill-opacity="0.48" filter="url(#textGlow)"/>

    <!-- Personal headline -->
    <text class="sans glow-breath" x="425" y="114" text-anchor="middle" font-size="42" font-weight="800" letter-spacing="-0.8" fill="#7C6CF6" filter="url(#textGlow)">Alizhan Toleukhan_</text>
    <text class="sans" x="425" y="114" text-anchor="middle" font-size="42" font-weight="800" letter-spacing="-0.8"><tspan fill="url(#peachText)">Alizhan</tspan><tspan fill="#FFFFFF"> Toleukhan</tspan><tspan class="cursor-blink" fill="#E6C29F">_</tspan></text>

    <!-- Grounded personal terminal prompt -->
    <text class="mono" x="28" y="188" font-size="12" letter-spacing="0.2"><tspan fill="#7C6CF6">$ </tspan><tspan fill="#94A3B8">ls ~/shipped  </tspan><tspan fill="#71717A"># </tspan><tspan fill="#E6C29F">FireWatch-AI  jas-crm  KitchenApp</tspan></text>
    <text class="mono" x="822" y="188" text-anchor="end" font-size="11" letter-spacing="1.4" fill="#71717A">ASTANA · KZ</text>
  </g>

  <rect x="0.5" y="0.5" width="849" height="209" rx="14" stroke="#1F222E"/>
</svg>
