<svg xmlns="http://www.w3.org/2000/svg" width="850" height="250" viewBox="0 0 850 250" fill="none" role="img" aria-labelledby="heroTitle heroDesc">
  <title id="heroTitle">Welcome to Alizhan Github_</title>
  <desc id="heroDesc">Dark hero card with an animated 3D vortex funnel, glowing Welcome to Alizhan Github headline, and terminal prompt $ git push --force-of-will.</desc>
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif; }
    .mono { font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; }

    .vortex-sway {
      transform-origin: 425px 235px;
      animation: sway 9s ease-in-out infinite;
    }
    @keyframes sway {
      0%, 100% { transform: translateX(0px) rotate(-1.2deg); }
      50% { transform: translateX(7px) rotate(1.2deg); }
    }

    .r01 { animation: spin01 9.8s linear infinite; }
    .r02 { animation: spin02 9.2s linear infinite; }
    .r03 { animation: spin03 8.5s linear infinite; }
    .r04 { animation: spin04 7.8s linear infinite; }
    .r05 { animation: spin05 7.2s linear infinite; }
    .r06 { animation: spin06 6.6s linear infinite; }
    .r07 { animation: spin07 6.0s linear infinite; }
    .r08 { animation: spin08 5.5s linear infinite; }
    .r09 { animation: spin09 5.0s linear infinite; }
    .r10 { animation: spin10 4.5s linear infinite; }
    .r11 { animation: spin11 4.1s linear infinite; }
    .r12 { animation: spin12 3.7s linear infinite; }
    .r13 { animation: spin13 3.3s linear infinite; }
    .r14 { animation: spin14 3.0s linear infinite; }

    @keyframes spin01 { from { stroke-dashoffset: 0; } to { stroke-dashoffset: -379.7; } }
    @keyframes spin02 { from { stroke-dashoffset: 0; } to { stroke-dashoffset: -343.9; } }
    @keyframes spin03 { from { stroke-dashoffset: 0; } to { stroke-dashoffset: -308.1; } }
    @keyframes spin04 { from { stroke-dashoffset: 0; } to { stroke-dashoffset: -272.4; } }
    @keyframes spin05 { from { stroke-dashoffset: 0; } to { stroke-dashoffset: -236.6; } }
    @keyframes spin06 { from { stroke-dashoffset: 0; } to { stroke-dashoffset: -203.8; } }
    @keyframes spin07 { from { stroke-dashoffset: 0; } to { stroke-dashoffset: -260.6; } }
    @keyframes spin08 { from { stroke-dashoffset: 0; } to { stroke-dashoffset: -219.4; } }
    @keyframes spin09 { from { stroke-dashoffset: 0; } to { stroke-dashoffset: -182.0; } }
    @keyframes spin10 { from { stroke-dashoffset: 0; } to { stroke-dashoffset: -149.4; } }
    @keyframes spin11 { from { stroke-dashoffset: 0; } to { stroke-dashoffset: -120.6; } }
    @keyframes spin12 { from { stroke-dashoffset: 0; } to { stroke-dashoffset: -95.7; } }
    @keyframes spin13 { from { stroke-dashoffset: 0; } to { stroke-dashoffset: -73.1; } }
    @keyframes spin14 { from { stroke-dashoffset: 0; } to { stroke-dashoffset: -50.6; } }

    .cursor-blink { animation: blink 1.15s ease-in-out infinite; }
    @keyframes blink {
      0%, 45% { opacity: 1; }
      55%, 95% { opacity: 0.1; }
      100% { opacity: 1; }
    }

    .glow-breath { animation: breath 6s ease-in-out infinite; }
    @keyframes breath {
      0%, 100% { opacity: 0.55; }
      50% { opacity: 0.9; }
    }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }
  </style>
  <defs>
    <clipPath id="heroClip">
      <rect x="0.5" y="0.5" width="849" height="249" rx="14"/>
    </clipPath>
    <radialGradient id="bgRadial" cx="425" cy="118" r="460" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#171929"/>
      <stop offset="0.55" stop-color="#0D0E14"/>
      <stop offset="1" stop-color="#0B0C10"/>
    </radialGradient>
    <radialGradient id="indigoAura" cx="425" cy="116" r="290" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7C6CF6" stop-opacity="0.28"/>
      <stop offset="0.55" stop-color="#7C6CF6" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#7C6CF6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="peachAura" cx="425" cy="215" r="200" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#E6C29F" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#E6C29F" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="peachText" x1="0" y1="100" x2="0" y2="146" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F3C98B"/>
      <stop offset="1" stop-color="#E6C29F"/>
    </linearGradient>
    <filter id="textGlow" x="-15%" y="-70%" width="130%" height="240%">
      <feGaussianBlur stdDeviation="11"/>
    </filter>
  </defs>

  <g clip-path="url(#heroClip)">
    <rect width="850" height="250" fill="url(#bgRadial)"/>
    <rect class="glow-breath" width="850" height="250" fill="url(#indigoAura)"/>
    <rect width="850" height="250" fill="url(#peachAura)"/>

    <!-- Subtle ambient stars -->
    <g fill="#FFFFFF">
      <circle cx="118" cy="44" r="1" fill-opacity="0.28"/>
      <circle cx="242" cy="26" r="1.1" fill-opacity="0.22"/>
      <circle cx="678" cy="38" r="1" fill-opacity="0.26"/>
      <circle cx="764" cy="86" r="1.2" fill-opacity="0.2"/>
      <circle cx="88" cy="156" r="1" fill-opacity="0.22"/>
      <circle cx="732" cy="198" r="1" fill-opacity="0.25"/>
    </g>

    <!-- 3D rotating tornado funnel (14 tilted elliptical layers) -->
    <g class="vortex-sway" stroke-linecap="round">
      <!-- Faint continuous depth wireframe -->
      <g stroke="#94A3B8" stroke-opacity="0.09" stroke-width="1">
        <ellipse cx="425" cy="34" rx="276" ry="42" transform="rotate(-7 425 34)"/>
        <ellipse cx="430" cy="48" rx="250" ry="38" transform="rotate(-7 430 48)"/>
        <ellipse cx="434" cy="62" rx="224" ry="34" transform="rotate(-7 434 62)"/>
        <ellipse cx="436" cy="76" rx="198" ry="30" transform="rotate(-7 436 76)"/>
        <ellipse cx="435" cy="91" rx="172" ry="26" transform="rotate(-6.5 435 91)"/>
        <ellipse cx="432" cy="106" rx="148" ry="23" transform="rotate(-6.5 432 106)"/>
        <ellipse cx="428" cy="121" rx="126" ry="20" transform="rotate(-6 428 121)"/>
        <ellipse cx="423" cy="136" rx="106" ry="17" transform="rotate(-6 423 136)"/>
        <ellipse cx="419" cy="151" rx="88" ry="14" transform="rotate(-5.5 419 151)"/>
        <ellipse cx="417" cy="166" rx="72" ry="12" transform="rotate(-5.5 417 166)"/>
        <ellipse cx="418" cy="181" rx="58" ry="10" transform="rotate(-5 418 181)"/>
        <ellipse cx="421" cy="196" rx="46" ry="8" transform="rotate(-5 421 196)"/>
        <ellipse cx="425" cy="211" rx="35" ry="6.5" transform="rotate(-4.5 425 211)"/>
        <ellipse cx="428" cy="225" rx="24" ry="5" transform="rotate(-4.5 428 225)"/>
      </g>

      <!-- Animated segmented arcs rotating around each ellipse -->
      <ellipse class="r01" cx="425" cy="34" rx="276" ry="42" transform="rotate(-7 425 34)" stroke="#94A3B8" stroke-opacity="0.34" stroke-width="1.2" stroke-dasharray="159.5 53.2 91.1 75.9"/>
      <ellipse class="r02" cx="430" cy="48" rx="250" ry="38" transform="rotate(-7 430 48)" stroke="#E6C29F" stroke-opacity="0.40" stroke-width="1.3" stroke-dasharray="144.5 48.2 82.5 68.7"/>
      <ellipse class="r03" cx="434" cy="62" rx="224" ry="34" transform="rotate(-7 434 62)" stroke="#94A3B8" stroke-opacity="0.36" stroke-width="1.2" stroke-dasharray="129.4 43.1 74.0 61.6"/>
      <ellipse class="r04" cx="436" cy="76" rx="198" ry="30" transform="rotate(-7 436 76)" stroke="#D5C8FF" stroke-opacity="0.30" stroke-width="1.1" stroke-dasharray="114.4 38.1 65.4 54.5"/>
      <ellipse class="r05" cx="435" cy="91" rx="172" ry="26" transform="rotate(-6.5 435 91)" stroke="#E6C29F" stroke-opacity="0.44" stroke-width="1.3" stroke-dasharray="99.4 33.1 56.8 47.3"/>
      <ellipse class="r06" cx="432" cy="106" rx="148" ry="23" transform="rotate(-6.5 432 106)" stroke="#94A3B8" stroke-opacity="0.38" stroke-width="1.2" stroke-dasharray="85.6 28.5 48.9 40.8"/>
      <ellipse class="r07" cx="428" cy="121" rx="126" ry="20" transform="rotate(-6 428 121)" stroke="#E6C29F" stroke-opacity="0.48" stroke-width="1.3" stroke-dasharray="109.5 36.5 62.6 52.0"/>
      <ellipse class="r08" cx="423" cy="136" rx="106" ry="17" transform="rotate(-6 423 136)" stroke="#94A3B8" stroke-opacity="0.40" stroke-width="1.2" stroke-dasharray="92.1 30.7 52.7 43.9"/>
      <ellipse class="r09" cx="419" cy="151" rx="88" ry="14" transform="rotate(-5.5 419 151)" stroke="#7C6CF6" stroke-opacity="0.46" stroke-width="1.3" stroke-dasharray="76.5 25.5 43.7 36.3"/>
      <ellipse class="r10" cx="417" cy="166" rx="72" ry="12" transform="rotate(-5.5 417 166)" stroke="#E6C29F" stroke-opacity="0.52" stroke-width="1.35" stroke-dasharray="62.7 20.9 35.8 30.0"/>
      <ellipse class="r11" cx="418" cy="181" rx="58" ry="10" transform="rotate(-5 418 181)" stroke="#94A3B8" stroke-opacity="0.46" stroke-width="1.2" stroke-dasharray="50.6 16.9 28.9 24.2"/>
      <ellipse class="r12" cx="421" cy="196" rx="46" ry="8" transform="rotate(-5 421 196)" stroke="#F3C98B" stroke-opacity="0.56" stroke-width="1.35" stroke-dasharray="40.2 13.4 23.0 19.1"/>
      <ellipse class="r13" cx="425" cy="211" rx="35" ry="6.5" transform="rotate(-4.5 425 211)" stroke="#94A3B8" stroke-opacity="0.48" stroke-width="1.15" stroke-dasharray="30.7 10.2 17.5 14.7"/>
      <ellipse class="r14" cx="428" cy="225" rx="24" ry="5" transform="rotate(-4.5 428 225)" stroke="#E6C29F" stroke-opacity="0.55" stroke-width="1.2" stroke-dasharray="21.2 7.1 12.1 10.2"/>
    </g>

    <!-- Soft dark vignette behind headline for crisp legibility -->
    <ellipse cx="425" cy="124" rx="310" ry="44" fill="#0B0C10" fill-opacity="0.45" filter="url(#textGlow)"/>

    <!-- Headline glow layer -->
    <text class="sans glow-breath" x="425" y="136" text-anchor="middle" font-size="42" font-weight="800" letter-spacing="-0.8" fill="#7C6CF6" filter="url(#textGlow)">Welcome to Alizhan Github_</text>

    <!-- Headline foreground -->
    <text class="sans" x="425" y="136" text-anchor="middle" font-size="42" font-weight="800" letter-spacing="-0.8"><tspan fill="#FFFFFF">Welcome to </tspan><tspan fill="url(#peachText)">Alizhan</tspan><tspan fill="#FFFFFF"> Github</tspan><tspan class="cursor-blink" fill="#E6C29F">_</tspan></text>

    <!-- Bottom-left monospace terminal line -->
    <text class="mono" x="28" y="226" font-size="12.5" letter-spacing="0.2"><tspan fill="#7C6CF6">$ </tspan><tspan fill="#94A3B8">git push </tspan><tspan fill="#E6C29F">--force-of-will</tspan></text>
  </g>

  <rect x="0.5" y="0.5" width="849" height="249" rx="14" stroke="#1F222E"/>
</svg>
